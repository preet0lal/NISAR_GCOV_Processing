name: Validate NISAR GCOV scripts

# Run lightweight source checks on GitHub. This is NOT the MAAP DPS build.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax
        run: |
          python -m py_compile NISAR_GCOV_TO_TIFF_E.py nisar_dps_wrapper.py

      - name: Check shell syntax
        run: |
          bash -n NISAR_GCOV_TIFF_E.sh
          bash -n run_nisar_dps.sh

      - name: Check MAAP 7x7 enhanced Lee configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("nisar_dps_wrapper.py").read_text(encoding="utf-8")
          assert '"--filter", "enhanced_lee"' in source
          assert '"--filter_window", "7"' in source
          print("Confirmed enhanced Lee speckle filtering with a 7x7 window.")
          PY
